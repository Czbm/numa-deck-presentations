<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
<rect width="1280" height="760" fill="#0b1220"/><text x="40" y="52" font-size="30" font-weight="700" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Contrastación estructural y constructiva: Castillo vs. Columna</text><text x="40" y="78" font-size="14" font-weight="600" fill="#8b9bb4" font-family="Segoe UI, Arial, sans-serif">LIA0102 — Sesión 10 | Síntesis comparativa 4.2–4.3 (Plenaria AC-01)</text><line x1="40" y1="92" x2="1240" y2="92" stroke="#2a3a55"/>
<rect x="40" y="110" width="480" height="70" rx="12" fill="#162033" stroke="#3b82f6" stroke-width="2"/>
<text x="60" y="142" font-size="17" font-weight="700" fill="#3b82f6" font-family="Segoe UI, Arial, sans-serif">CASTILLO DE CONFINAMIENTO (4.2)</text>
<text x="60" y="164" font-size="12" fill="#8b9bb4" font-family="Segoe UI, Arial, sans-serif">Elemento de confinamiento embebido en muro</text>
<rect x="420" y="125" width="84" height="40" rx="6" fill="#0b1220" stroke="#2a3a55"/><rect x="428" y="139" width="68" height="12" fill="#3b82f6"/><rect x="454" y="135" width="16" height="20" rx="2" fill="#f59e0b"/>
<rect x="760" y="110" width="480" height="70" rx="12" fill="#162033" stroke="#38bdf8" stroke-width="2"/>
<text x="780" y="142" font-size="17" font-weight="700" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif">COLUMNA ESTRUCTURAL (4.3)</text>
<text x="780" y="164" font-size="12" fill="#8b9bb4" font-family="Segoe UI, Arial, sans-serif">Soporte principal exento de marco rígido</text>
<rect x="1140" y="125" width="84" height="40" rx="6" fill="#0b1220" stroke="#2a3a55"/><rect x="1170" y="131" width="28" height="28" rx="3" fill="none" stroke="#38bdf8" stroke-width="3"/><circle cx="1175" cy="136" r="2.6" fill="#ef4444"/><circle cx="1193" cy="136" r="2.6" fill="#ef4444"/><circle cx="1175" cy="154" r="2.6" fill="#ef4444"/><circle cx="1193" cy="154" r="2.6" fill="#ef4444"/>
<rect x="540" y="110" width="200" height="70" rx="12" fill="#0b1220" stroke="#2a3a55"/>
<text x="640.0" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#8b9bb4" font-family="Segoe UI, Arial, sans-serif">EJE DE CONTRASTE</text>
<text x="640.0" y="162" text-anchor="middle" font-size="11" fill="#8b9bb4" font-family="Segoe UI, Arial, sans-serif">5 criterios verificables</text>
<line x1="640.0" y1="180" x2="640.0" y2="640" stroke="#2a3a55" stroke-width="2" stroke-dasharray="4 5"/>
<line x1="520" y1="234.0" x2="540" y2="234.0" stroke="#3b82f6" stroke-opacity=".5" stroke-width="2"/>
<line x1="740" y1="234.0" x2="760" y2="234.0" stroke="#38bdf8" stroke-opacity=".5" stroke-width="2"/>
<rect x="40" y="196" width="480" height="76" rx="10" fill="#162033" stroke="#3b82f6" stroke-opacity=".8"/>
<rect x="760" y="196" width="480" height="76" rx="10" fill="#162033" stroke="#38bdf8" stroke-opacity=".8"/>
<rect x="540" y="196" width="200" height="76" rx="10" fill="#0b1220" stroke="#2a3a55"/>
<circle cx="566" cy="234.0" r="12" fill="#3b82f6"/><text x="566" y="238.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Segoe UI, Arial, sans-serif">1</text>
<text x="590" y="232.0" font-size="13" font-weight="700" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Función</text>
<text x="590" y="249.0" font-size="13" font-weight="700" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">estructural</text>
<text x="60" y="228" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Confina paños de mampostería para evitar agrietamiento</text>
<text x="60" y="248" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">frágil; <tspan fill="#f59e0b" font-weight="700">no sustituye a una columna</tspan>.</text>
<text x="780" y="228" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif"><tspan fill="#38bdf8" font-weight="700">Soporte vertical principal</tspan> de marco; recibe trabes y losas</text>
<text x="780" y="248" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">y resiste carga axial y flexión sin depender de muros.</text>
<line x1="520" y1="322.0" x2="540" y2="322.0" stroke="#3b82f6" stroke-opacity=".5" stroke-width="2"/>
<line x1="740" y1="322.0" x2="760" y2="322.0" stroke="#38bdf8" stroke-opacity=".5" stroke-width="2"/>
<rect x="40" y="284" width="480" height="76" rx="10" fill="#162033" stroke="#3b82f6" stroke-opacity=".8"/>
<rect x="760" y="284" width="480" height="76" rx="10" fill="#162033" stroke="#38bdf8" stroke-opacity=".8"/>
<rect x="540" y="284" width="200" height="76" rx="10" fill="#0b1220" stroke="#2a3a55"/>
<circle cx="566" cy="322.0" r="12" fill="#3b82f6"/><text x="566" y="326.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Segoe UI, Arial, sans-serif">2</text>
<text x="590" y="320.0" font-size="13" font-weight="700" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Sección mínima</text>
<text x="590" y="337.0" font-size="13" font-weight="700" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">y esbeltez</text>
<text x="60" y="316" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Sección reducida y esbelta, generalmente <tspan fill="#f59e0b" font-weight="700">igual al espesor</tspan></text>
<text x="60" y="336" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif"><tspan fill="#f59e0b" font-weight="700">del muro portante</tspan> al que confina.</text>
<text x="780" y="316" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif"><tspan fill="#38bdf8" font-weight="700">Sección robusta</tspan> dimensionada como elemento portante</text>
<text x="780" y="336" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">principal independiente.</text>
<line x1="520" y1="410.0" x2="540" y2="410.0" stroke="#3b82f6" stroke-opacity=".5" stroke-width="2"/>
<line x1="740" y1="410.0" x2="760" y2="410.0" stroke="#38bdf8" stroke-opacity=".5" stroke-width="2"/>
<rect x="40" y="372" width="480" height="76" rx="10" fill="#162033" stroke="#3b82f6" stroke-opacity=".8"/>
<rect x="760" y="372" width="480" height="76" rx="10" fill="#162033" stroke="#38bdf8" stroke-opacity=".8"/>
<rect x="540" y="372" width="200" height="76" rx="10" fill="#0b1220" stroke="#2a3a55"/>
<circle cx="566" cy="410.0" r="12" fill="#3b82f6"/><text x="566" y="414.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Segoe UI, Arial, sans-serif">3</text>
<text x="590" y="408.0" font-size="13" font-weight="700" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Armado y</text>
<text x="590" y="425.0" font-size="13" font-weight="700" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">estribos</text>
<text x="60" y="404" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Refuerzo mínimo de confinamiento con estribos de sujeción</text>
<text x="60" y="424" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">(criterio <tspan fill="#f59e0b" font-weight="700">NTC-Mampostería</tspan>).</text>
<text x="780" y="404" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Mayor cuantía longitudinal y <tspan fill="#38bdf8" font-weight="700">estribos cerrados con gancho</tspan></text>
<text x="780" y="424" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif"><tspan fill="#38bdf8" font-weight="700">a 135°</tspan> (criterio NTC-Concreto).</text>
<line x1="520" y1="498.0" x2="540" y2="498.0" stroke="#3b82f6" stroke-opacity=".5" stroke-width="2"/>
<line x1="740" y1="498.0" x2="760" y2="498.0" stroke="#38bdf8" stroke-opacity=".5" stroke-width="2"/>
<rect x="40" y="460" width="480" height="76" rx="10" fill="#162033" stroke="#3b82f6" stroke-opacity=".8"/>
<rect x="760" y="460" width="480" height="76" rx="10" fill="#162033" stroke="#38bdf8" stroke-opacity=".8"/>
<rect x="540" y="460" width="200" height="76" rx="10" fill="#0b1220" stroke="#2a3a55"/>
<circle cx="566" cy="498.0" r="12" fill="#3b82f6"/><text x="566" y="502.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Segoe UI, Arial, sans-serif">4</text>
<text x="590" y="496.0" font-size="13" font-weight="700" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Descarga en</text>
<text x="590" y="513.0" font-size="13" font-weight="700" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">subestructura</text>
<text x="60" y="492" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Descarga sobre cadena de desplante y <tspan fill="#f59e0b" font-weight="700">zapata corrida</tspan></text>
<text x="60" y="512" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">(transmisión lineal continua junto con el muro).</text>
<text x="780" y="492" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Descarga puntual concentrada sobre <tspan fill="#38bdf8" font-weight="700">dado y zapata</tspan></text>
<text x="780" y="512" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif"><tspan fill="#38bdf8" font-weight="700">aislada</tspan>.</text>
<line x1="520" y1="586.0" x2="540" y2="586.0" stroke="#3b82f6" stroke-opacity=".5" stroke-width="2"/>
<line x1="740" y1="586.0" x2="760" y2="586.0" stroke="#38bdf8" stroke-opacity=".5" stroke-width="2"/>
<rect x="40" y="548" width="480" height="76" rx="10" fill="#162033" stroke="#3b82f6" stroke-opacity=".8"/>
<rect x="760" y="548" width="480" height="76" rx="10" fill="#162033" stroke="#38bdf8" stroke-opacity=".8"/>
<rect x="540" y="548" width="200" height="76" rx="10" fill="#0b1220" stroke="#2a3a55"/>
<circle cx="566" cy="586.0" r="12" fill="#3b82f6"/><text x="566" y="590.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Segoe UI, Arial, sans-serif">5</text>
<text x="590" y="584.0" font-size="13" font-weight="700" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Secuencia</text>
<text x="590" y="601.0" font-size="13" font-weight="700" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">respecto al muro</text>
<text x="60" y="580" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Se cuela <tspan fill="#f59e0b" font-weight="700">DESPUÉS</tspan> de levantar el muro (dentado con cimbra</text>
<text x="60" y="600" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">a 2–3 caras o ahogado en celdas de block hueco).</text>
<text x="780" y="580" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Se cuela <tspan fill="#38bdf8" font-weight="700">ANTES</tspan> de los cerramientos, dentro de cimbra</text>
<text x="780" y="600" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">estanca a 4 caras debidamente plomeada.</text>
<rect x="40" y="652" width="1200" height="64" rx="10" fill="#0f2a28" stroke="#10b981" stroke-width="1.5"/><rect x="56" y="664" width="150" height="20" rx="4" fill="#10b981"/><text x="131" y="678" text-anchor="middle" font-size="11" font-weight="700" fill="#052e2b" font-family="Segoe UI, Arial, sans-serif">REGLA DE OBRA (AC-01)</text><text x="220" y="679" font-size="15" font-weight="700" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">El castillo confina al muro; la columna sustituye al muro como soporte (no son intercambiables).</text><text x="56" y="705" font-size="11" fill="#8b9bb4" font-family="Segoe UI, Arial, sans-serif">Referencia técnica supletoria: NTC-Mampostería y NTC-Concreto (CDMX 2023) aplicadas como referencia técnica en Mérida.</text>
</svg>