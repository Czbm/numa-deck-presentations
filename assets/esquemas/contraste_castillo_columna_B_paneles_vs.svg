<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
<rect width="1280" height="760" fill="#0b1220"/><text x="40" y="52" font-size="30" font-weight="700" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Contrastación estructural y constructiva: Castillo vs. Columna</text><text x="40" y="78" font-size="14" font-weight="600" fill="#8b9bb4" font-family="Segoe UI, Arial, sans-serif">LIA0102 — Sesión 10 | Síntesis comparativa 4.2–4.3 (Plenaria AC-01)</text><line x1="40" y1="92" x2="1240" y2="92" stroke="#2a3a55"/>
<rect x="40" y="108" width="560" height="552" rx="16" fill="#0b1220" stroke="#3b82f6" stroke-width="2" stroke-opacity=".9"/>
<rect x="40" y="108" width="560" height="76" rx="16" fill="#3b82f6" fill-opacity=".14"/>
<text x="64" y="144" font-size="19" font-weight="700" fill="#3b82f6" font-family="Segoe UI, Arial, sans-serif">CASTILLO DE CONFINAMIENTO (4.2)</text>
<text x="64" y="168" font-size="12.5" fill="#8b9bb4" font-family="Segoe UI, Arial, sans-serif">Elemento de confinamiento embebido en muro</text>
<rect x="492" y="126" width="84" height="40" rx="6" fill="#0b1220" stroke="#2a3a55"/><rect x="500" y="140" width="68" height="12" fill="#3b82f6"/><rect x="526" y="136" width="16" height="20" rx="2" fill="#f59e0b"/>
<rect x="56" y="198" width="528" height="80" rx="10" fill="#162033" stroke="#2a3a55"/>
<rect x="56" y="198" width="5" height="80" rx="2" fill="#3b82f6"/>
<text x="76" y="220" font-size="11" font-weight="700" letter-spacing="1.2" fill="#3b82f6" font-family="Segoe UI, Arial, sans-serif">1 · FUNCIÓN ESTRUCTURAL</text>
<text x="76" y="242" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Confina paños de mampostería para evitar agrietamiento</text>
<text x="76" y="261" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">frágil; <tspan fill="#f59e0b" font-weight="700">no sustituye a una columna</tspan>.</text>
<rect x="56" y="288" width="528" height="80" rx="10" fill="#162033" stroke="#2a3a55"/>
<rect x="56" y="288" width="5" height="80" rx="2" fill="#3b82f6"/>
<text x="76" y="310" font-size="11" font-weight="700" letter-spacing="1.2" fill="#3b82f6" font-family="Segoe UI, Arial, sans-serif">2 · SECCIÓN MÍNIMA Y ESBELTEZ</text>
<text x="76" y="332" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Sección reducida y esbelta, generalmente <tspan fill="#f59e0b" font-weight="700">igual al espesor</tspan></text>
<text x="76" y="351" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif"><tspan fill="#f59e0b" font-weight="700">del muro portante</tspan> al que confina.</text>
<rect x="56" y="378" width="528" height="80" rx="10" fill="#162033" stroke="#2a3a55"/>
<rect x="56" y="378" width="5" height="80" rx="2" fill="#3b82f6"/>
<text x="76" y="400" font-size="11" font-weight="700" letter-spacing="1.2" fill="#3b82f6" font-family="Segoe UI, Arial, sans-serif">3 · ARMADO Y ESTRIBOS</text>
<text x="76" y="422" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Refuerzo mínimo de confinamiento con estribos de sujeción</text>
<text x="76" y="441" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">(criterio <tspan fill="#f59e0b" font-weight="700">NTC-Mampostería</tspan>).</text>
<rect x="56" y="468" width="528" height="80" rx="10" fill="#162033" stroke="#2a3a55"/>
<rect x="56" y="468" width="5" height="80" rx="2" fill="#3b82f6"/>
<text x="76" y="490" font-size="11" font-weight="700" letter-spacing="1.2" fill="#3b82f6" font-family="Segoe UI, Arial, sans-serif">4 · DESCARGA EN SUBESTRUCTURA</text>
<text x="76" y="512" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Descarga sobre cadena de desplante y <tspan fill="#f59e0b" font-weight="700">zapata corrida</tspan></text>
<text x="76" y="531" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">(transmisión lineal continua junto con el muro).</text>
<rect x="56" y="558" width="528" height="80" rx="10" fill="#162033" stroke="#2a3a55"/>
<rect x="56" y="558" width="5" height="80" rx="2" fill="#3b82f6"/>
<text x="76" y="580" font-size="11" font-weight="700" letter-spacing="1.2" fill="#3b82f6" font-family="Segoe UI, Arial, sans-serif">5 · SECUENCIA RESPECTO AL MURO</text>
<text x="76" y="602" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Se cuela <tspan fill="#f59e0b" font-weight="700">DESPUÉS</tspan> de levantar el muro (dentado con cimbra</text>
<text x="76" y="621" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">a 2–3 caras o ahogado en celdas de block hueco).</text>
<rect x="680" y="108" width="560" height="552" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2" stroke-opacity=".9"/>
<rect x="680" y="108" width="560" height="76" rx="16" fill="#38bdf8" fill-opacity=".14"/>
<text x="704" y="144" font-size="19" font-weight="700" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif">COLUMNA ESTRUCTURAL (4.3)</text>
<text x="704" y="168" font-size="12.5" fill="#8b9bb4" font-family="Segoe UI, Arial, sans-serif">Soporte principal exento de marco rígido</text>
<rect x="1132" y="126" width="84" height="40" rx="6" fill="#0b1220" stroke="#2a3a55"/><rect x="1162" y="132" width="28" height="28" rx="3" fill="none" stroke="#38bdf8" stroke-width="3"/><circle cx="1167" cy="137" r="2.6" fill="#ef4444"/><circle cx="1185" cy="137" r="2.6" fill="#ef4444"/><circle cx="1167" cy="155" r="2.6" fill="#ef4444"/><circle cx="1185" cy="155" r="2.6" fill="#ef4444"/>
<rect x="696" y="198" width="528" height="80" rx="10" fill="#162033" stroke="#2a3a55"/>
<rect x="696" y="198" width="5" height="80" rx="2" fill="#38bdf8"/>
<text x="716" y="220" font-size="11" font-weight="700" letter-spacing="1.2" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif">1 · FUNCIÓN ESTRUCTURAL</text>
<text x="716" y="242" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif"><tspan fill="#38bdf8" font-weight="700">Soporte vertical principal</tspan> de marco; recibe trabes y losas</text>
<text x="716" y="261" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">y resiste carga axial y flexión sin depender de muros.</text>
<rect x="696" y="288" width="528" height="80" rx="10" fill="#162033" stroke="#2a3a55"/>
<rect x="696" y="288" width="5" height="80" rx="2" fill="#38bdf8"/>
<text x="716" y="310" font-size="11" font-weight="700" letter-spacing="1.2" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif">2 · SECCIÓN MÍNIMA Y ESBELTEZ</text>
<text x="716" y="332" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif"><tspan fill="#38bdf8" font-weight="700">Sección robusta</tspan> dimensionada como elemento portante</text>
<text x="716" y="351" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">principal independiente.</text>
<rect x="696" y="378" width="528" height="80" rx="10" fill="#162033" stroke="#2a3a55"/>
<rect x="696" y="378" width="5" height="80" rx="2" fill="#38bdf8"/>
<text x="716" y="400" font-size="11" font-weight="700" letter-spacing="1.2" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif">3 · ARMADO Y ESTRIBOS</text>
<text x="716" y="422" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Mayor cuantía longitudinal y <tspan fill="#38bdf8" font-weight="700">estribos cerrados con gancho</tspan></text>
<text x="716" y="441" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif"><tspan fill="#38bdf8" font-weight="700">a 135°</tspan> (criterio NTC-Concreto).</text>
<rect x="696" y="468" width="528" height="80" rx="10" fill="#162033" stroke="#2a3a55"/>
<rect x="696" y="468" width="5" height="80" rx="2" fill="#38bdf8"/>
<text x="716" y="490" font-size="11" font-weight="700" letter-spacing="1.2" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif">4 · DESCARGA EN SUBESTRUCTURA</text>
<text x="716" y="512" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Descarga puntual concentrada sobre <tspan fill="#38bdf8" font-weight="700">dado y zapata</tspan></text>
<text x="716" y="531" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif"><tspan fill="#38bdf8" font-weight="700">aislada</tspan>.</text>
<rect x="696" y="558" width="528" height="80" rx="10" fill="#162033" stroke="#2a3a55"/>
<rect x="696" y="558" width="5" height="80" rx="2" fill="#38bdf8"/>
<text x="716" y="580" font-size="11" font-weight="700" letter-spacing="1.2" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif">5 · SECUENCIA RESPECTO AL MURO</text>
<text x="716" y="602" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">Se cuela <tspan fill="#38bdf8" font-weight="700">ANTES</tspan> de los cerramientos, dentro de cimbra</text>
<text x="716" y="621" font-size="13.5" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">estanca a 4 caras debidamente plomeada.</text>
<line x1="640" y1="108" x2="640" y2="660" stroke="#2a3a55" stroke-width="2" stroke-dasharray="4 5"/>
<circle cx="640" cy="146" r="22" fill="#0b1220" stroke="#2a3a55" stroke-width="2"/>
<text x="640" y="152" text-anchor="middle" font-size="16" font-weight="800" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">VS</text>
<circle cx="640" cy="238" r="13" fill="#3b82f6"/><text x="640" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Segoe UI, Arial, sans-serif">1</text>
<circle cx="640" cy="328" r="13" fill="#3b82f6"/><text x="640" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Segoe UI, Arial, sans-serif">2</text>
<circle cx="640" cy="418" r="13" fill="#3b82f6"/><text x="640" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Segoe UI, Arial, sans-serif">3</text>
<circle cx="640" cy="508" r="13" fill="#3b82f6"/><text x="640" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Segoe UI, Arial, sans-serif">4</text>
<circle cx="640" cy="598" r="13" fill="#3b82f6"/><text x="640" y="602" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Segoe UI, Arial, sans-serif">5</text>
<rect x="40" y="680" width="1200" height="64" rx="10" fill="#0f2a28" stroke="#10b981" stroke-width="1.5"/><rect x="56" y="692" width="150" height="20" rx="4" fill="#10b981"/><text x="131" y="706" text-anchor="middle" font-size="11" font-weight="700" fill="#052e2b" font-family="Segoe UI, Arial, sans-serif">REGLA DE OBRA (AC-01)</text><text x="220" y="707" font-size="15" font-weight="700" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">El castillo confina al muro; la columna sustituye al muro como soporte (no son intercambiables).</text><text x="56" y="733" font-size="11" fill="#8b9bb4" font-family="Segoe UI, Arial, sans-serif">Referencia técnica supletoria: NTC-Mampostería y NTC-Concreto (CDMX 2023) aplicadas como referencia técnica en Mérida.</text>
</svg>